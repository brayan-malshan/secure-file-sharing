{% extends "base.html" %}
{% block title %}Verify — SecureShare{% endblock %}
{% block content %}
<div class="form-card card">
    <h2>Two-factor verification</h2>
    <p class="form-note">Hi {{ username }} — enter the 6-digit code from your authenticator app to finish logging in.</p>
    <form method="POST" action="{{ url_for('login_verify_2fa') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="code">Authentication code</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required autofocus placeholder="123456">
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px;">Verify &amp; continue</button>
    </form>
    <form method="POST" action="{{ url_for('login_verify_2fa') }}" style="margin-top:14px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="use_backup" value="1">
        <label for="backup_code">Or use a backup code instead</label>
        <input type="text" id="backup_code" name="code" placeholder="xxxx-xxxx" autocomplete="off">
        <button type="submit" class="btn btn-secondary btn-block" style="margin-top:10px;">Use backup code</button>
    </form>
</div>
{% endblock %}
